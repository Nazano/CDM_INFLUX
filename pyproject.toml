[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdm-influx"
version = "0.1.0"
description = "Collect, structure and explore YouTube World Cup 2026 predictions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "chromadb>=0.5.0,<1.0.0",
  "ollama>=0.3.0,<1.0.0",
  "plotly>=5.24.0,<6.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "PyYAML>=6.0.1,<7.0.0",
  "streamlit>=1.39.0,<2.0.0",
  "youtube-transcript-api>=1.2.4,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
